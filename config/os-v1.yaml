# Tag taxonomy — PROPOSED structure only. The exhaustive tag list is a Phase 5
# deliverable produced AFTER discovery confirms what tags already exist in the
# account (to avoid proposing duplicates). Prefixes below are fixed; specific
# tag values are illustrative starting points, not a final list.
tag_taxonomy:
  prefixes:
    "SRC |": "Lead source (e.g. 'SRC | Facebook Ad', 'SRC | Referral')"
    "INT |": "Expressed interest (e.g. 'INT | Life Insurance', 'INT | Annuity', 'INT | IBC')"
    "STATUS |": "Lifecycle/status marker (e.g. 'STATUS | Hot Lead', 'STATUS | Do Not Contact')"
    "AGENT |": "Recruiting/agent-track marker (e.g. 'AGENT | Licensed', 'AGENT | In Training')"
    "CLIENT |": "Client-relationship marker (e.g. 'CLIENT | Active', 'CLIENT | Annual Review Due')"
    "CAMPAIGN |": "Campaign attribution (e.g. 'CAMPAIGN | Q1-Recruiting')"
    "COMPLIANCE |": "Compliance-relevant marker (e.g. 'COMPLIANCE | Replacement Review Required')"
  deployment_status: NOT_CREATED
