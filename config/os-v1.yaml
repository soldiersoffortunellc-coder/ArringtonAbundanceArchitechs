# =============================================================================
# Open Doors Financial OS v1 — Canonical Data Model (SOURCE OF TRUTH)
# =============================================================================
# STATUS: PROPOSED. Nothing below has been created in GoHighLevel.
# deployment_status values used throughout this file:
#   NOT_CREATED | PENDING_APPROVAL | CREATING | CREATED | VERIFIED | CONFLICT
#
# Every object the system creates gets a logical_name (the key). The rest of
# the codebase (n8n workflows, agent tools, dashboards) must reference objects
# by logical_name through config/ghl-object-registry.json — never a
# hard-coded GHL id. This file is the human-authored proposal;
# ghl-object-registry.json is the machine-readable, script-updated ledger of
# what has actually been created and its real ids.
#
# No secrets live in this file. GHL ids are not secrets, but until an id is
# real it stays "" — never fabricated.
# =============================================================================

version: 1
location_logical_name: open_doors_financial_group   # maps to $GHL_LOCATION_ID at runtime — never hard-coded here

pipelines:
  insurance_sales_pipeline:
    type: pipeline
    name: "01 | Insurance Sales"
    purpose: "Primary consumer insurance sales motion: lead through issued/placed business."
    id: ""
    deployment_status: NOT_CREATED
    dependencies: []
    stages:
      - New Lead
      - Attempting Contact
      - Contacted
      - Qualified
      - Appointment Scheduled
      - Appointment Confirmed
      - Discovery Completed
      - Illustration / Proposal
      - Application Started
      - Application Submitted
      - Underwriting
      - Requirements Outstanding
      - Approved
      - Issued
      - Placed / Paid
      - Client
      - Not Now
      - Lost

  agent_recruiting_pipeline:
    type: pipeline
    name: "02 | Agent Recruiting"
    purpose: "Prospective licensed/unlicensed agent recruiting funnel."
    id: ""
    deployment_status: NOT_CREATED
    dependencies: []
    stages:
      - New Prospect
      - Contact Attempted
      - Engaged
      - Qualified
      - Opportunity Presentation
      - Interview Scheduled
      - Interview Completed
      - Decision Pending
      - Joining
      - Not Now
      - Declined

  licensing_pipeline:
    type: pipeline
    name: "03 | Licensing"
    purpose: "Tracks an unlicensed recruit through pre-licensing coursework to contracting-ready."
    id: ""
    deployment_status: NOT_CREATED
    dependencies: [agent_recruiting_pipeline]
    stages:
      - Licensing Candidate
      - Course Enrolled
      - Course In Progress
      - Pre-License Complete
      - Exam Scheduled
      - Exam Passed
      - License Application
      - License Approved
      - Ready for Contracting
      - Stalled

  agent_onboarding_pipeline:
    type: pipeline
    name: "04 | Agent Onboarding"
    purpose: "New agent from contracting through activation and leadership track."
    id: ""
    deployment_status: NOT_CREATED
    dependencies: [agent_recruiting_pipeline, licensing_pipeline]
    stages:
      - New Agent
      - Contracting Started
      - Carrier Contracting
      - CRM Setup
      - Training Started
      - Fast Start
      - First Appointments
      - First Application
      - First Issued Business
      - Activated
      - Leadership Track

  annuity_rollover_pipeline:
    type: pipeline
    name: "05 | Annuity / Rollover"
    purpose: "Annuity and retirement-account-rollover sales motion."
    id: ""
    deployment_status: NOT_CREATED
    dependencies: []
    stages:
      - New Opportunity
      - Qualified
      - Discovery
      - Statements Requested
      - Statements Received
      - Analysis
      - Recommendation Meeting
      - Application
      - Transfer Initiated
      - Transfer Pending
      - Issued
      - Funded
      - Client
      - Lost

  ibc_debt_action_pipeline:
    type: pipeline
    name: "06 | IBC / Debt Action"
    purpose: "Infinite Banking Concept / debt strategy sales and implementation motion."
    id: ""
    deployment_status: NOT_CREATED
    dependencies: []
    stages:
      - New Prospect
      - Qualified
      - Cash Flow Discovery
      - Debt Analysis
      - Strategy Design
      - Presentation Scheduled
      - Presentation Completed
      - Illustration
      - Application
      - Underwriting
      - Approved
      - Placed
      - Implementation
      - Annual Review
      - Not Now
      - Lost

